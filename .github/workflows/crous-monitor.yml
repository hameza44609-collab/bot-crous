name: CROUS Monitor

on:
  schedule:
    # Every 5 minutes, shifted away from :00 to reduce peak cron congestion.
    # Five minutes is GitHub Actions' minimum supported schedule interval.
    - cron: "2-59/5 * * * *"
  # Allow running the workflow by hand from the Actions tab.
  workflow_dispatch: {}

# Required so the workflow can commit the updated state.json back to the repo.
permissions:
  contents: write

# Prevent two runs from pushing state at the same time.
concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A queued or re-run workflow can carry an older event SHA. Resolve
          # the branch again when the job starts so state.json is always current.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: >-
          pip install --disable-pip-version-check --no-input --no-compile
          --only-binary=:all: -r requirements.txt

      - name: Run CROUS monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional compatibility/key-rotation secrets; /start handles all
          # normal subscriptions without a configured chat id.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
          MONITOR_INTERVAL_SECONDS: "15"
          MONITOR_CYCLES_PER_RUN: "20"
        run: |
          for ((cycle = 1; cycle <= MONITOR_CYCLES_PER_RUN; cycle++)); do
            cycle_started=$SECONDS
            echo "::group::Monitor cycle ${cycle}/${MONITOR_CYCLES_PER_RUN}"
            python crous_bot.py
            echo "::endgroup::"

            if ((cycle < MONITOR_CYCLES_PER_RUN)); then
              elapsed=$((SECONDS - cycle_started))
              sleep_for=$((MONITOR_INTERVAL_SECONDS - elapsed))
              if ((sleep_for > 0)); then
                sleep "$sleep_for"
              fi
            fi
          done

      - name: Persist state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update CROUS monitoring state [skip ci]"
            # Runs are serialized above. Do not rebase divergent encrypted
            # state automatically: failing is safer than losing a subscription.
            git push
          else
            echo "No state change; nothing to commit."
          fi
